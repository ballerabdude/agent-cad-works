[project]
name = "agent-cad-works"
version = "0.1.0"
description = "Agent-driven mechanical design: build123d parts, verification gates, slicing, FreeCAD exploded views and Blender photoreal renders."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Abdul Hagi" }]
dependencies = [
    "build123d==0.13.0",
    "trimesh==5.2.0",
    "manifold3d==3.5.4",
    "shapely==2.2.0",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "networkx==3.7",
    "rtree==1.4.1",
    "matplotlib==3.11.2",
    "pillow==13.0.0",
]

[project.scripts]
agentcad = "agentcad.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: builds and checks a full example design (about a minute)"]
